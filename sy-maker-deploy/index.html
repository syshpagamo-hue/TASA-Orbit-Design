<script>
const SIZES=['XS','S','M','L','XL','2XL','3XL'];const ROLES={member:'西苑創客社員',school:'西苑社外人員',other:'其他所有人'};const app=document.querySelector('#app');let step=-1,mode='checking',busy=false,receipt=null,reduce=false;let order=blank();

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return Number(n).toLocaleString('zh-TW')}
function quote(o){let shirts=SIZES.reduce((a,s)=>a+(+o.shirts[s]||0),0),n=+o.necklace||0,k=+o.keyring||0,acc=n+k,rows=[],total=0;const add=(name,q,unit)=>{if(q>0){rows.push({name,q,unit,amount:q*unit});total+=q*unit}};if(o.role==='member'){if(shirts<1)return{rows,total:0,shirts,n,k,error:'社員至少需要一件社服，第一件會自動套用社員套餐。'};let firstAcc=acc>0?1:0;add(firstAcc?(n?'社員套餐｜社服＋項鍊':'社員套餐｜社服＋鑰匙圈'):'社員基本｜社服',1,firstAcc?550:400);shirts--;if(n&&firstAcc)n--;else if(k&&firstAcc)k--;add('社員加購社服',shirts,400);let pairs=Math.floor((n+k)/2);add('社員配件套餐 C｜任兩件配件',pairs,280);let remain=(n+k)-pairs*2;add('社員單配件',remain,150)}else{let pairCount=Math.min(shirts,n+k);for(let i=0;i<pairCount;i++){add('套餐 A｜社服＋配件',1,570);shirts--;if(n)n--;else k--}let ap=Math.floor((n+k)/2);add('套餐 B｜任兩件配件',ap,300);let ar=(n+k)-ap*2;add('單點社服',shirts,420);add('單點配件',ar,160)}return{rows,total,shirts:SIZES.reduce((a,s)=>a+(+o.shirts[s]||0),0),n:+o.necklace||0,k:+o.keyring||0}}

function progress(){let names=['身分','資料','選購','備註','確認'];return`<ol class="progress">${names.map((x,i)=>`<li class="${i===step?'on':''}"><i>${i<step?'✓':'0'+(i+1)}</i>${x}</li>`).join('')}</ol>`}
function heading(en,zh,p){return`<div class="heading"><span class="eyebrow">0${step+1} / ${en}</span><h1>${zh}</h1><p>${p}</p></div>`}
function roles(){return heading('YOUR IDENTITY','選擇你的身分。','點一下即可繼續。')+`<div class="role-grid">${[['member','✳','西苑創客社員'],['school','◇','西苑社外人員'],['other','↗','其他所有人']].map(([id,g,n])=>`<button class="role ${order.role===id?'sel':''}" data-role="${id}"><span class="mark"></span><span class="glyph">${g}</span><h2>${n}</h2></button>`).join('')}</div>`}
function info(){return heading('A LITTLE ABOUT YOU','留下訂購資料。','只收集整理訂單與聯絡所需要的資料。')+`<section class="panel"><div class="field"><label>姓名</label><input data-field="name" value="${esc(order.customer.name)}" maxlength="50" placeholder="請填寫姓名"></div>${order.role==='other'?`<div class="field"><label>聯絡電話</label><input data-field="phone" value="${esc(order.customer.phone)}" placeholder="0912 345 678"></div>`:`<div class="fieldpair"><div class="field"><label>班級</label><input data-field="className" value="${esc(order.customer.className)}" placeholder="例如：高一 1 班"></div><div class="field"><label>座號</label><input data-field="seat" value="${esc(order.customer.seat)}" inputmode="numeric" placeholder="08"></div></div>`}</section>`}
function qty(path,v){return`<div class="qtybox"><button data-adj="${path}" data-d="-1">−</button><input value="${v}" data-count="${path}" inputmode="numeric"><button data-adj="${path}" data-d="1">+</button></div>`}
function shop(){let q=quote(order);return heading('BUILD YOUR COLLECTION','組合你的創客日常。','不用自己算套餐，系統會依你選的數量自動合併成目前最省的組合。')+`<div class="notice">AUTO BUNDLE / 單點數量會自動重新計算優惠套餐，不需要手動加入套餐。</div><div class="products"><section class="product"><div class="product-head"><h3>社服 THE TEE</h3><span class="price">${order.role==='member'?'社員加購 NT$400':'單點 NT$420'}</span></div><div class="sizes">${SIZES.map(s=>`<div class="size"><label>${s}</label>${qty('shirts.'+s,order.shirts[s])}</div>`).join('')}</div></section><section class="product"><div class="product-head"><h3>配件 OBJECTS</h3><span class="price">項鍊 / 鑰匙圈</span></div><div class="access"><span>項鍊 Necklace</span>${qty('necklace',order.necklace)}</div><div class="access"><span>鑰匙圈 Keyring</span>${qty('keyring',order.keyring)}</div></section></div>`}
function notes(){return heading('LEAVE A NOTE','還有什麼想告訴我們？','特殊需求或想問的事情，可以一起留下。')+`<section class="panel"><div class="field"><label>備註 / 特殊需求</label><textarea data-area="note">${esc(order.note)}</textarea></div><div class="field"><label>想詢問社團的問題</label><textarea data-area="question">${esc(order.question)}</textarea></div></section>`}
function confirm(){let q=quote(order);return heading('ONE LAST LOOK','最後確認一次。','確認資料、品項與金額後送出。')+`<section class="panel"><div class="review"><span>身分</span><b>${esc(ROLES[order.role])}</b></div><div class="review"><span>姓名</span><b>${esc(order.customer.name)}</b></div>${order.role==='other'?`<div class="review"><span>電話</span><b>${esc(order.customer.phone)}</b></div>`:`<div class="review"><span>班級 / 座號</span><b>${esc(order.customer.className)} / ${esc(order.customer.seat)}</b></div>`}</section><section class="panel"><h3>系統自動套用</h3>${q.rows.map(r=>`<div class="review"><span>${esc(r.name)} × ${r.q}</span><b>NT$ ${money(r.amount)}</b></div>`).join('')}<div class="total"><span>合計</span><strong>NT$ ${money(q.total)}</strong></div></section><section class="panel"><label style="display:flex;gap:12px"><input type="checkbox" data-consent ${order.consent?'checked':''} style="width:20px"><span>我已確認上述資料，並同意西苑創客為處理本次訂購使用我填寫的資訊。</span></label></section>`}
function summary(){let q=quote(order);return`<aside class="summary"><span class="eyebrow">YOUR EDIT</span><h3>你的選物</h3>${q.rows.length?q.rows.map(r=>`<div class="sumrow"><span>${esc(r.name)}<small>數量 ${r.q}</small></span><b>$${money(r.amount)}</b></div>`).join(''):'<p style="color:#817986">商品會出現在這裡。</p>'}<div class="total"><span>合計</span><strong>NT$ ${money(q.total)}</strong></div><p style="color:#837b89;font-size:11px">社服 ${q.shirts} 件 / 項鍊 ${q.n} / 鑰匙圈 ${q.k}</p></aside>`}
function actions(){return`<div class="actions"><button class="textbtn" data-back>← ${step===0?'返回首頁':'上一步'}</button><button class="button" data-next ${step===0&&!order.role?'disabled':''}>${step===4?'確認送出':'下一步'} ↗</button></div>`}
function render(anim=true){if(step<0){app.innerHTML=home();return}let page=[roles,info,shop,notes,confirm][step]();app.innerHTML=`<section class="flow ${anim?'glitch':''}">${progress()}<div class="grid2"><div>${page}${actions()}</div>${step>0?summary():''}</div></section>`}
function setPath(path,val){let a=path.split('.'),o=order;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a.at(-1)]=val}
function validate(){if(step===0&&!order.role)throw Error('請選擇身分');if(step===1){if(!order.customer.name.trim())throw Error('請填姓名');if(order.role==='other'){if(order.customer.phone.replace(/\D/g,'').length<7)throw Error('請填有效電話')}else if(!order.customer.className.trim()||!/^\d{1,3}$/.test(order.customer.seat))throw Error('請填班級與座號')}if(step===2){let q=quote(order);if(q.total<=0)throw Error('請至少選一項商品');if(order.role==='member'&&q.error)throw Error(q.error)}if(step===4&&!order.consent)throw Error('請勾選資料確認')}
async function submit(){if(busy)return;validate();busy=true;document.querySelector('[data-next]').disabled=true;document.querySelector('[data-next]').textContent='正在儲存…';try{let r=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({order,quote:quote(order)})});let j=await r.json();if(!r.ok)throw Error(j.error||'儲存失敗');receipt=j.receipt;showSuccess()}catch(e){alert(e.message);busy=false;render(false)}}
function showSuccess(){app.innerHTML=`<section class="success"><span class="eyebrow">YOUR ORDER IS SAVED</span><h1>你的訂單，已收到。</h1><p style="color:#a398aa">請保留訂單編號；完成登記不代表已付款。</p><section class="panel receipt"><div class="review"><span>訂單編號</span><b>${esc(receipt.id)}</b></div>${receipt.quote.rows.map(r=>`<div class="review"><span>${esc(r.name)} × ${r.q}</span><b>$${money(r.amount)}</b></div>`).join('')}<div class="total"><span>合計</span><strong>NT$ ${money(receipt.quote.total)}</strong></div></section><section class="game"><div class="gamebar"><div><span class="eyebrow">MAKER LOOP</span><h2 style="margin:5px 0">靈感反應測試</h2></div><div><b id="score">0</b> pts · <b id="lives">♥♥♥</b></div></div><p style="color:#a895b2">點中目標得分；速度會持續變快。沒點到會失去生命，直到 Game Over。</p><div class="gamefield" id="gamefield"><div class="gameoverlay" id="gameover"><button class="button" id="gameStart">開始遊戲 ↗</button></div><button class="target hidden" id="target">✦</button></div><div class="leader"><h3>排行榜 / 每人只保留最高分</h3><ol id="leader"><li>讀取中…</li></ol></div></section></section>`;loadLeader();document.querySelector('#gameStart').onclick=startGame}
let gs=0,gl=3,gt=null,gdelay=900;function startGame(){gs=0;gl=3;gdelay=900;document.querySelector('#score').textContent='0';document.querySelector('#lives').textContent='♥♥♥';document.querySelector('#gameover').classList.add('hidden');document.querySelector('#target').classList.remove('hidden');moveTarget()}
function moveTarget(){clearTimeout(gt);let f=document.querySelector('#gamefield'),t=document.querySelector('#target');if(!f||!t)return;t.style.left=12+Math.random()*Math.max(10,f.clientWidth-82)+'px';t.style.top=12+Math.random()*Math.max(10,f.clientHeight-82)+'px';let hit=false;t.onclick=()=>{if(hit)return;hit=true;gs++;document.querySelector('#score').textContent=gs;gdelay=Math.max(280,gdelay-20);moveTarget()};gt=setTimeout(()=>{if(hit)return;gl--;document.querySelector('#lives').textContent='♥'.repeat(gl)+'♡'.repeat(3-gl);if(gl<=0)endGame();else moveTarget()},gdelay)}
async function endGame(){clearTimeout(gt);document.querySelector('#target').classList.add('hidden');let ov=document.querySelector('#gameover');ov.classList.remove('hidden');ov.innerHTML=`<div><div class="eyebrow">GAME OVER</div><h2>${gs} POINTS</h2><button class="button" id="again">再玩一次 ↗</button></div>`;document.querySelector('#again').onclick=startGame;try{await fetch('/api/leaderboard',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:receipt?.customer?.name||'PLAYER',score:gs})});loadLeader()}catch{}}
async function loadLeader(){try{let r=await fetch('/api/leaderboard'),j=await r.json();let l=document.querySelector('#leader');if(l)l.innerHTML=(j.items||[]).slice(0,10).map(x=>`<li><b>${esc(x.name)}</b> · ${x.score}</li>`).join('')||'<li>還沒有人上榜</li>'}catch{}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.matches('[data-home]')){step=-1;render()}if(b.matches('[data-start]')){order=blank();step=0;render();petRun()}if(b.dataset.role){order.role=b.dataset.role;render(false);petRun()}if(b.dataset.adj){let cur=b.dataset.adj.includes('.')?b.dataset.adj.split('.').reduce((o,k)=>o[k],order):order[b.dataset.adj];setPath(b.dataset.adj,Math.max(0,Math.min(99,+cur+(+b.dataset.d))));render(false)}if(b.matches('[data-back]')){if(step===0)step=-1;else step--;render();petRun()}if(b.matches('[data-next]')){try{validate();if(step===4)submit();else{step++;render();petRun();scrollTo(0,0)}}catch(err){alert(err.message)}}});document.addEventListener('input',e=>{let el=e.target;if(el.dataset.field!==undefined)order.customer[el.dataset.field]=el.value;if(el.dataset.area!==undefined)order[el.dataset.area]=el.value;if(el.dataset.count){let v=Math.max(0,Math.min(99,parseInt(el.value)||0));setPath(el.dataset.count,v)}if(el.matches('[data-consent]'))order.consent=el.checked});
function petRun(){let p=document.querySelector('#pet');p.classList.remove('run');void p.offsetWidth;p.classList.add('run');setTimeout(()=>p.classList.remove('run'),1050)}document.querySelector('#skip').onclick=()=>document.querySelector('#intro').classList.add('off');setTimeout(()=>document.querySelector('#intro').classList.add('off'),4300);document.querySelector('#motion').onclick=()=>{reduce=!reduce;document.body.classList.toggle('reduce',reduce);document.querySelector('#motion').textContent=reduce?'動態 已降低':'動態 開啟'};
fetch('/api/config',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(()=>{mode='live';document.querySelector('#status').textContent='商品預購 · 收單服務已連線'}).catch(()=>{mode='unavailable';document.querySelector('#status').textContent='目前為展示模式 · 收單服務尚未連線'});render();
</script>
</body>
</html>
